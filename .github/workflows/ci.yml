name: price-ci

on:
  push:
    branches: [main, "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -race -cover ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Build image
        run: docker build -t sky-price:ci .
      - name: Verify non-root image
        run: test "$(docker image inspect sky-price:ci --format '{{.Config.User}}')" = "10001:10001"
